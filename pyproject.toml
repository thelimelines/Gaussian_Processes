[project]
name = "gaussian-processes-book"
version = "0.1.0"
description = "Standalone interactive Gaussian process explainer app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "streamlit>=1.42.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pyright",
    "ruff",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["app.py", "chapters", "src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["app.py", "src/gp_book"]
ignore_missing_imports = true

[tool.uv]
package = false
